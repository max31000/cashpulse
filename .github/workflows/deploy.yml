# CashPulse CI/CD: backend (tests → image → deploy → health) then frontend (tests → build → upload).
# One workflow so that an auth switch lands backend-first; a push that only touches the frontend skips the
# backend job and still deploys the frontend. workflow_dispatch deploys both.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed parts
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'src/**'
              - 'tests/**'
              - 'CashPulse.sln'
              - 'CashPulse.slnx'
              - '.github/workflows/deploy.yml'
            frontend:
              - 'cashpulse-web/**'
              - '.github/workflows/deploy.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/cashpulse-api:sha-${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore CashPulse.sln

      - name: Build
        run: dotnet build CashPulse.sln --no-restore -c Release

      - name: Unit tests
        run: dotnet test tests/CashPulse.Tests/CashPulse.Tests.csproj --no-build -c Release --verbosity normal

      - name: Integration tests
        run: dotnet test tests/CashPulse.IntegrationTests/CashPulse.IntegrationTests.csproj --no-build -c Release --verbosity normal
        env:
          DOTNET_ENVIRONMENT: Testing

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the immutable sha tag: watchtower has no `latest` to pull and the label below opts the container out.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          file: src/CashPulse.Api/Dockerfile
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Auth is the shared mvv42-auth: the container only needs the DB and the docker network
      # (JWKS from http://mvv42-auth:8080). No JWT secret, no bot token.
      - name: Deploy on VDS
        uses: appleboy/ssh-action@v1
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          IMAGE: ${{ env.IMAGE }}
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          envs: DB_CONNECTION_STRING,IMAGE
          script: |
            set -e
            REPO="${IMAGE%:*}"
            # 1. JWKS of mvv42-auth must be reachable on the docker network, or every request would 401.
            docker run --rm --network cashpulse-network curlimages/curl:8.10.1 -sf --max-time 10 \
              http://mvv42-auth:8080/auth/.well-known/jwks.json > /dev/null \
              || { echo "JWKS http://mvv42-auth:8080 not reachable from cashpulse-network - refusing to deploy"; exit 1; }

            docker pull "$IMAGE"
            # 2. Remember what runs now, for the rollback (empty on the first deploy).
            OLD="$(docker inspect -f '{{.Config.Image}}' cashpulse-api 2>/dev/null || true)"
            echo "previous image: ${OLD:-<none>}"

            start() {
              docker stop cashpulse-api > /dev/null 2>&1 || true
              docker rm cashpulse-api > /dev/null 2>&1 || true
              docker run -d \
                --name cashpulse-api \
                --network cashpulse-network \
                --restart unless-stopped \
                --label com.centurylinklabs.watchtower.enable=false \
                -p 127.0.0.1:5000:5000 \
                -p 127.0.0.1:9500:9091 \
                -e "ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}" \
                "$1" > /dev/null
            }
            healthy() {
              for i in $(seq 1 20); do
                curl -sf http://localhost:5000/health > /dev/null && return 0
                sleep 2
              done
              return 1
            }

            start "$IMAGE"
            if ! healthy; then
              echo "Health check failed on $IMAGE"
              docker logs --tail 50 cashpulse-api || true
              if [ -n "$OLD" ] && [ "$OLD" != "$IMAGE" ]; then
                echo "Rolling back to $OLD"
                start "$OLD"
                healthy && echo "Rolled back to $OLD (healthy)" || echo "Rollback to $OLD is NOT healthy either"
              else
                echo "No previous image to roll back to"
              fi
              exit 1
            fi
            echo "cashpulse-api healthy on $IMAGE"

            # 3. Keep only the current and the previous image of this repo.
            docker images "$REPO" --format '{{.Repository}}:{{.Tag}}' | while read -r img; do
              [ "$img" = "$IMAGE" ] || [ "$img" = "$OLD" ] || docker rmi "$img" > /dev/null 2>&1 || true
            done
            docker image prune -f > /dev/null

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="❌ CashPulse API deploy failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  frontend:
    needs: [changes, backend]
    if: ${{ !cancelled() && contains(fromJSON('["success","skipped"]'), needs.backend.result) && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: cashpulse-web/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: cashpulse-web

      - name: Type check
        run: yarn typecheck
        working-directory: cashpulse-web

      - name: Run frontend tests
        run: yarn test:run
        working-directory: cashpulse-web

      # The API is called same-origin at /cashpulse/api/… (VITE_API_URL defaults to /cashpulse): the mvv42
      # access cookie is host-only and SameSite=Strict, so no absolute API URL.
      - name: Build
        run: yarn build
        working-directory: cashpulse-web

      - name: Deploy to VDS via SCP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          source: cashpulse-web/dist/*
          target: /var/www/cashpulse/
          strip_components: 2
          rm: true

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          script: |
            curl -sf https://mvv42.ru/cashpulse/ > /dev/null
            # unauthenticated API answers 401 (not 404/5xx) through the convention route
            test "$(curl -s -o /dev/null -w '%{http_code}' https://mvv42.ru/cashpulse/api/accounts)" = 401

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="❌ CashPulse Frontend deploy failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
