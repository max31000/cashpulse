version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: cashpulse-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cashpulse_dev}
      MYSQL_DATABASE: cashpulse
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cashpulse-network

  api:
    build:
      context: .
      dockerfile: src/CashPulse.Api/Dockerfile
    container_name: cashpulse-api
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: "Server=mysql;Database=cashpulse;User=root;Password=${MYSQL_ROOT_PASSWORD:-cashpulse_dev};"
      # Auth: shared mvv42-auth, no app secret. This stack does not run mvv42-auth: point the JWKS at one
      # (default: a local `dotnet run` of mvv42-auth on the host, port 5010). Without it every API call is 401.
      # Browser access must go through the Vite dev server (same origin, proxies /cashpulse/api and /auth).
      Mvv42Auth__JwksUrl: ${MVV42_JWKS_URL:-http://host.docker.internal:5010/auth/.well-known/jwks.json}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cashpulse-network

volumes:
  mysql_data:

networks:
  cashpulse-network:
    name: cashpulse-network
    # external: true  # раскомментировать на VDS если сеть создана вручную через deploy-vds.sh
